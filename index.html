<html>
  <head>
    <link
      href="https://fonts.cdnfonts.com/css/cursed-timer-ulil"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div class="home-container">
        <h3 class="header">HOME</h3>
        <h2 id="home-digit-banner">0</h2>
        <div class="increment-buttons">
          <button class="button1" onclick="increment1()">+1</button>
          <button class="button2" onclick="increment2()">+2</button>
          <button class="button3" onclick="increment3()">+3</button>
        </div>
      </div>
      <div class="guest-container">
        <h3 class="header">AWAY</h3>
        <h2 id="guest-digit-banner">0</h2>
        <div class="increment-buttons">
          <button class="button1" onclick="increment1g()">+1</button>
          <button class="button2" onclick="increment2g()">+2</button>
          <button class="button3" onclick="increment3g()">+3</button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
